
<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
</head>
<body>
   
     <center>
    <table border="2px">
        <caption><h1>Student Details</h1></caption>
        <tr>
            <th>Name</th>
            <th>Branch</th>
            <th>Age</th>
            <th>Place</th>
            <th>Phone</th>
            <th>DOB</th>
            <th>Email</th>
        </tr>

        {% for i in stud %} 
        <tr>
            <td>{{ i.name }}</td>
            <td>{{ i.branch }}</td>
            <td>{{ i.age }}</td>
            <td>{{ i.place }}</td>
            <td>{{ i.phone }}</td>
            <td>{{ i.dob }}</td>
            <td>{{ i.email }}</td>
        </tr>
        {% endfor %}
    </table>
    </center>
</body>
</html>
