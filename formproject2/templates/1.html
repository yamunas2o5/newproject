<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
</head>
<body>

    <table border="2px">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Place</th>
            <th>Email</th>
            <th>DOB</th>
        </tr>

        {% for i in stud %}
        <tr>
            <td>{{ i.name }}</td>
            <td>{{ i.age }}</td>
            <td>{{ i.place }}</td>
            <td>{{ i.email }}</td>
            <td>{{ i.dob }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
