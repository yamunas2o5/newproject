

<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Employee Details</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
    }

    h1 {
        text-align: center;
        margin-top: 20px;
        border-radius: 20px;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 20px;
        background-color: #9bd8b9;
        padding: 20px;
        margin: 20px;
        border-radius: 20px;
    }

    .product-card {
        background-color: #fff;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        margin: 10px;
        padding: 20px;
        width: 300px;
        text-align: center;
    }

    .product-card img {
        max-width: 100%;
        height: 200px;
        border-radius: 5px;
    }

    .product-card p {
        margin: 10px 0;
    }

    .product-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 35px rgb(64, 62, 62);
        
    }
    h1{
        background-color: #361389ce;
        width: auto;
        height: 50px;
        
    }


</style>

<body>
    <nav>
        <a></a>Home</a>
        About</a>
        Services</a>
       Contact</a>
    </nav>


    <h1>Product Details</h1>

    <div class="container">

        {% for i in prod %}

        <div class="product-card">

            <img src="{{ i.image.url }}">

            <p><strong>product name:</strong> {{ i.name }}</p>
            <p><strong>Brand:</strong> {{ i.brand }}</p>
            <p><strong>Material:</strong> {{ i.material }}</p>
            <p><strong>Price:</strong> {{ i.price }}</p>
            <p><strong>Description:</strong> {{ i.description }}</p>

        </div>

        {% endfor %}

    </div>

</body>
</html>
